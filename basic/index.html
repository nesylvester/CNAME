<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Unwind — New Episodes</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:#0e0a18; color:#f4f1fb;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
    display:flex; justify-content:center;}
  .app{width:390px; max-width:100vw; min-height:100vh; padding:0 18px 40px;
    background:linear-gradient(180deg,#1d1330,#0e0a18 55%);}
  .status{height:50px; display:flex; align-items:center; justify-content:space-between;
    font-size:14px; font-weight:700; color:#cfc6e6; padding:0 4px;}
  header{padding:8px 4px 4px;}
  header .k{font-size:12px; letter-spacing:1.2px; text-transform:uppercase; color:#ffb454; font-weight:800;}
  header h1{margin:4px 0 0; font-size:28px; font-weight:800; letter-spacing:-.5px;}
  header p{margin:6px 0 0; color:#a99ec7; font-size:14px;}
  .item{display:flex; gap:14px; align-items:center; padding:14px 0; border-bottom:1px solid rgba(255,255,255,.07);}
  .poster{width:58px; height:82px; border-radius:12px; flex:none; position:relative;
    display:flex; align-items:flex-end; padding:7px; font-weight:800; font-size:12px;
    color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.5);}
  .badge{position:absolute; top:6px; left:6px; background:#ff7a8a; color:#fff;
    font-size:9px; font-weight:900; padding:2px 6px; border-radius:6px;}
  .info{flex:1; min-width:0;}
  .t{font-size:17px; font-weight:800;}
  .m{font-size:13px; color:#a99ec7; margin-top:3px;}
  .svc{display:inline-block; margin-top:8px; font-size:11px; font-weight:800;
    background:rgba(255,255,255,.12); padding:5px 11px; border-radius:999px;}
  .open{font-size:22px; color:#6f6490;}
  .foot{text-align:center; color:#6f6490; font-size:11px; margin-top:26px; line-height:1.6;}
  .toast{position:fixed; bottom:34px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#fff; color:#2a1550; padding:12px 18px; border-radius:999px; font-size:13px; font-weight:800;
    opacity:0; transition:.3s; box-shadow:0 10px 30px rgba(0,0,0,.4);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
  <div class="status"><span>9:41</span><span>5G&nbsp; 100%</span></div>
  <header>
    <div class="k">New this week</div>
    <h1>New episodes</h1>
    <p>From shows you follow · tap one to open it</p>
  </header>

  <div id="list"></div>

  <div class="foot">
    Unwind links you to apps you already subscribe to.<br>
    Show data &amp; artwork via The Movie Database (TMDB).
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  // Sample data only — no accounts, no tracking. Swap for live TMDB data later.
  var shows=[
    {t:"Severance", ep:"S2 · E6 “Attila”", min:"48 min", svc:"Apple TV+", c1:"#5a4a8a", c2:"#241546", ab:"SEV"},
    {t:"The Last of Us", ep:"S2 · E3", min:"52 min", svc:"Max", c1:"#7d3a3a", c2:"#3a1414", ab:"TLOU"},
    {t:"Only Murders in the Building", ep:"S5 · E4", min:"30 min", svc:"Hulu", c1:"#caa04a", c2:"#5e3d12", ab:"OMB"},
    {t:"The Bear", ep:"S4 · E2", min:"34 min", svc:"Hulu", c1:"#4a7d5e", c2:"#143a26", ab:"BEAR"},
    {t:"Andor", ep:"S2 · E5", min:"45 min", svc:"Disney+", c1:"#3a6ea5", c2:"#16324f", ab:"AND"}
  ];
  var list=document.getElementById('list');
  shows.forEach(function(s){
    var d=document.createElement('div'); d.className='item';
    d.innerHTML=
      '<div class="poster" style="background:linear-gradient(160deg,'+s.c1+','+s.c2+')">'+s.ab+'<div class="badge">NEW</div></div>'+
      '<div class="info"><div class="t">'+s.t+'</div>'+
      '<div class="m">'+s.ep+' · '+s.min+'</div>'+
      '<span class="svc">▶ '+s.svc+'</span></div>'+
      '<div class="open">›</div>';
    d.onclick=function(){toast('Would open '+s.svc+' →');};
    list.appendChild(d);
  });
  var tEl=document.getElementById('toast'),tT;
  function toast(m){tEl.textContent=m;tEl.classList.add('show');clearTimeout(tT);
    tT=setTimeout(function(){tEl.classList.remove('show');},1600);}
</script>
</body>
</html>
