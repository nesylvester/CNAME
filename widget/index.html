<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Settle — Widgets</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh; display:flex; justify-content:center;
    background:linear-gradient(180deg,#b9a78f,#8a7560 60%,#5e4d3d);}
  .screen{width:390px; max-width:100vw; padding:64px 26px 40px; color:#fff;}
  .clock{text-align:center; margin-bottom:34px;}
  .clock .d{font-size:18px; font-weight:600; opacity:.95; letter-spacing:.5px;}
  .clock .t{font-size:74px; font-weight:600; letter-spacing:-2px; line-height:1; text-shadow:0 2px 12px rgba(0,0,0,.2);}

  .serif{font-family:ui-serif,"Iowan Old Style",Georgia,serif;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .w{background:#f4efe8; color:#231f1c; border-radius:22px; padding:16px; box-shadow:0 8px 24px rgba(0,0,0,.18);}
  .w .k{font-size:9px; letter-spacing:1.6px; text-transform:uppercase; color:#a35b46; font-weight:800;}

  /* small square */
  .small{aspect-ratio:1/1; display:flex; flex-direction:column;}
  .small .big{font-size:40px; font-weight:600; margin-top:4px; line-height:1;}
  .small .lbl{font-size:13px; color:#8b8175; margin-top:2px;}
  .small .pick{margin-top:auto; font-size:14px; font-weight:600;}
  .small .pick span{color:#8b8175; font-weight:500;}

  /* small craving */
  .craving{aspect-ratio:1/1; display:flex; flex-direction:column; justify-content:space-between;
    background:#231f1c; color:#f4efe8;}
  .craving .k{color:#cf8b6e;}
  .craving .food{font-size:28px; font-weight:600; line-height:1.1;}
  .craving .hint{font-size:12px; opacity:.6;}

  /* wide medium */
  .medium{grid-column:1/3; display:flex; gap:16px; align-items:center;}
  .medium .left{flex:1;}
  .medium .row{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid #e6ded2;}
  .medium .row:last-child{border:none;}
  .medium .dot{width:8px; height:8px; border-radius:50%; background:#a35b46; flex:none;}
  .medium .nm{font-size:13px; font-weight:600;}
  .medium .sv{font-size:11px; color:#8b8175; margin-left:auto;}
  .medium .cap{font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:#a35b46; font-weight:800; margin-bottom:6px;}

  .note{text-align:center; color:rgba(255,255,255,.85); font-size:12px; margin-top:30px; line-height:1.6;}

  /* dock-ish */
  .dock{margin-top:34px; height:78px; border-radius:30px; background:rgba(255,255,255,.18);
    backdrop-filter:blur(12px);}
</style>
</head>
<body>
<div class="screen">
  <div class="clock">
    <div class="d">Friday, June 6</div>
    <div class="t">9:41</div>
  </div>

  <div class="grid">
    <!-- small: tonight count -->
    <div class="w small">
      <div class="k">Tonight</div>
      <div class="big serif">3</div>
      <div class="lbl">new episodes</div>
      <div class="pick">Love Island USA<br><span>S7 · E18 · Peacock</span></div>
    </div>

    <!-- small: craving -->
    <div class="w craving">
      <div class="k">Craving</div>
      <div class="food serif">Thai<br>tonight?</div>
      <div class="hint">tap to spin</div>
    </div>

    <!-- medium: lineup -->
    <div class="w medium">
      <div class="left">
        <div class="cap">Settle · Tonight's lineup</div>
        <div class="row"><span class="dot"></span><span class="nm">Love Island USA</span><span class="sv">Peacock</span></div>
        <div class="row"><span class="dot"></span><span class="nm">Summer House</span><span class="sv">Peacock</span></div>
        <div class="row"><span class="dot"></span><span class="nm">Baylen Out Loud</span><span class="sv">Max</span></div>
      </div>
    </div>
  </div>

  <div class="dock"></div>
  <div class="note">Three widget sizes on your home screen.<br>One glance = what's new, where, and dinner.</div>
</div>
</body>
</html>
